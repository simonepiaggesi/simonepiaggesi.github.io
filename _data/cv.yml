        summary: KDD Lab member. ERC Advanced Grant *XAI* project team (2023-2025). Co-writer of the ERC Proof-of-Concept *ILLUME-4-Science* and WP-leader (2025-2026).
        highlights:
          - Designed and implemented meta-encoding pipelines to produce local explanations without per-sample surrogate retraining, achieving orders-of-magnitude faster inference and supporting XAI-assisted scientific hypothesis formulation (e.g., discovery of gene-gene interactions driving cancer cell drug response from transcriptomics data)
          - Built robust interpretability and counterfactual methods, improving explanation stability and auditability, outperforming SHAP/LIME while reducing explanation variance.

